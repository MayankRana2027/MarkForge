<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarkForge — Live Markdown Editor</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
</head>
<body>

  <!-- ── HEADER ── -->
  <header>
    <div class="logo">
      <div class="logo-icon">M↓</div>
      <span class="logo-text">Mark<span>Forge</span></span>
    </div>

    <div class="header-center">
      <div class="live-dot"></div>
      <span class="live-label">Live Preview</span>
    </div>

    <div class="header-actions">
      <button class="btn btn-ghost"    onclick="clearEditor()">Clear</button>
      <button class="btn btn-ghost"    onclick="copyHTML()">Copy HTML</button>
      <button class="btn btn-primary"  onclick="downloadHTML()">↓ Export</button>
    </div>
  </header>

  <!-- ── TOOLBAR ── -->
  <div class="toolbar">
    <div class="toolbar-group">
      <button class="tool-btn" onclick="insertMd('# ',   '')" title="H1">H1</button>
      <button class="tool-btn" onclick="insertMd('## ',  '')" title="H2">H2</button>
      <button class="tool-btn" onclick="insertMd('### ', '')" title="H3">H3</button>
    </div>

    <div class="toolbar-sep"></div>

    <div class="toolbar-group">
      <button class="tool-btn" onclick="insertMd('**','**')" title="Bold"><b>B</b></button>
      <button class="tool-btn" onclick="insertMd('*','*')"   title="Italic"><i>I</i></button>
      <button class="tool-btn" onclick="insertMd('~~','~~')" title="Strikethrough"><s>S</s></button>
      <button class="tool-btn" onclick="insertMd('`','`')"   title="Inline Code">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M5.48 4.56L1.04 8l4.44 3.44-.96 1.12L0 8l4.52-4.56.96 1.12zm5.04-1.12L15.04 8l-4.52 4.56-.96-1.12L13.96 8 9.56 3.56l.96-1.12z"/>
        </svg>
      </button>
    </div>

    <div class="toolbar-sep"></div>

    <div class="toolbar-group">
      <button class="tool-btn" onclick="insertMd('- ','')"  title="Bullet List">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M2 4h12v1.5H2V4zm0 3.5h12V9H2V7.5zm0 3.5h12v1.5H2V11zm-2-7h1.5v1.5H0V4zm0 3.5h1.5V9H0V7.5zm0 3.5h1.5v1.5H0V11z"/>
        </svg>
      </button>
      <button class="tool-btn" onclick="insertMd('1. ','')" title="Numbered List">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M4 4h10v1.5H4V4zm0 3.5h10V9H4V7.5zm0 3.5h10v1.5H4V11zM1 4.5h1V7H.5V5.5H0V4.5h1zm-.5 6.5H2V12H0v-.5l1.5-1.5H0v-.5h2v.5L.5 11.5z"/>
        </svg>
      </button>
      <button class="tool-btn" onclick="insertMd('> ','')"  title="Blockquote">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M3.5 6.5A2.5 2.5 0 016 4h.5v1.5H6A1 1 0 005 6.5V8h1.5v4H2V8h1.5V6.5zm7 0A2.5 2.5 0 0113 4h.5v1.5H13A1 1 0 0012 6.5V8h1.5v4H9V8h1.5V6.5z"/>
        </svg>
      </button>
    </div>

    <div class="toolbar-sep"></div>

    <div class="toolbar-group">
      <button class="tool-btn" onclick="insertMd('[','](url)')"    title="Link">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M4.5 3A3.5 3.5 0 001 6.5v.5h1.5v-.5A2 2 0 014.5 4.5H6V3H4.5zm5 0v1.5h1.5A2 2 0 0113 6.5V7h1.5v-.5A3.5 3.5 0 009.5 3H9zM1 7.5V8h1.5v-.5H1zm12 0V8H14.5v-.5H13zM1 8.5V9A3.5 3.5 0 004.5 12.5H6V11H4.5A2 2 0 012.5 9V8.5H1zm12 0V9A2 2 0 0111 11H9.5v1.5H11A3.5 3.5 0 0014.5 9v-.5H13zM5 7.5v1h6v-1H5z"/>
        </svg>
      </button>
      <button class="tool-btn" onclick="insertMd('![alt](',')')"   title="Image">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M14.5 1h-13A1.5 1.5 0 000 2.5v11A1.5 1.5 0 001.5 15h13a1.5 1.5 0 001.5-1.5v-11A1.5 1.5 0 0014.5 1zm-13 1.5h13v7.5l-2.5-2.5L9 11l-3-3-3 3.5V2.5zm2 2a1 1 0 100 2 1 1 0 000-2z"/>
        </svg>
      </button>
      <button class="tool-btn" onclick="insertCodeBlock()"          title="Code Block">```</button>
      <button class="tool-btn" onclick="insertMd('\n---\n','')"     title="Horizontal Rule">—</button>
      <button class="tool-btn" onclick="insertTable()"              title="Table">▦</button>
    </div>

    <span class="char-count" id="charCount">0 chars</span>
  </div>

  <!-- ── PANES ── -->
  <div class="panes">

    <!-- Editor -->
    <div class="editor-pane" id="editorPane">
      <div class="pane-header">
        <div class="pane-header-dot"></div>
        Markdown Source
      </div>
      <div class="editor-wrap">
        <div class="line-numbers" id="lineNumbers"></div>
        <textarea id="editor" spellcheck="false" placeholder="Start writing Markdown here…"></textarea>
      </div>
    </div>

    <!-- Resize Handle -->
    <div class="resize-handle" id="resizeHandle"></div>

    <!-- Preview -->
    <div class="preview-pane" id="previewPane">
      <div class="pane-header">
        <div class="pane-header-dot green"></div>
        HTML Preview
      </div>
      <iframe id="preview-frame" title="HTML Preview"></iframe>
    </div>

  </div>

  <!-- ── STATUS BAR ── -->
  <div class="statusbar">
    <span class="statusbar-item">MarkForge</span>
    <span class="sep">|</span>
    <span class="statusbar-item" id="wordCount">0 words</span>
    <span class="sep">|</span>
    <span class="statusbar-item" id="lineCount">0 lines</span>
    <span class="sep">|</span>
    <span class="statusbar-item" id="cursorPos">Ln 1, Col 1</span>
  </div>

  <!-- ── TOAST ── -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
